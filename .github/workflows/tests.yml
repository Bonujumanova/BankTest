name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start API
        run: |
          docker run -d --name bank_api_ci -p 4111:4111 clausmerderet/bank_api:latest

      - name: Wait for API
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:4111/api/swagger -o /dev/null; then
              echo "API is ready"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready"
          docker logs bank_api_ci
          exit 1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API tests
        run: python -m pytest src/main/api/tests -v